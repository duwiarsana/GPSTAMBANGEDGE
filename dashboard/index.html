<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kutai Fleet Edge — Live Mining Dashboard</title>
  <meta name="description" content="Real-time GPS tracking and telemetry dashboard for mining fleet operations in Kutai, East Kalimantan.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Custom Styling -->
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <!-- Fullscreen Map Background -->
  <div id="map" class="fullscreen-map"></div>

  <!-- Floating UI Overlay Layer -->
  <div class="floating-ui-layer pointer-events-none">
    
    <!-- TOP LEFT PANEL: Brand, Stats, & Controls -->
    <div class="floating-panel top-left-panel pointer-events-auto">
      
      <!-- Search/Brand Box (Always visible) -->
      <div class="brand-search-box">
        <button class="icon-btn menu-btn" id="menu-toggle-btn" aria-label="Toggle Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="brand-title">Kutai Fleet Monitor</div>
        <div class="brand-badge" id="live-badge">Live</div>
      </div>

      <!-- Collapsible Main Content -->
      <div class="panel-content-wrap" id="sidebar-content">
        
        <!-- Stats Row -->
        <div class="stats-row">
          <div class="mini-stat blue" title="Active Dump Trucks">
            <i class="fa-solid fa-truck"></i>
            <span id="count-dt">0</span>
          </div>
          <div class="mini-stat amber" title="Relayed Excavators">
            <i class="fa-solid fa-helmet-safety"></i>
            <span id="count-exca">0</span>
          </div>
          <div class="mini-stat green" title="ACKs Dispatched">
            <i class="fa-solid fa-circle-check"></i>
            <span id="count-ack">0</span>
          </div>
        </div>

        <hr class="divider">

        <!-- History Tracking -->
        <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Track History</div>
        <div class="form-row">
          <select id="history-device-select" class="form-select">
            <option value="">-- Unit --</option>
          </select>
          <select id="history-range-select" class="form-select">
            <option value="1">24H</option>
            <option value="7">7D</option>
            <option value="30" selected>30D</option>
          </select>
        </div>
        
        <div class="action-row">
          <button class="btn btn-primary" id="load-history-btn">
            <i class="fa-solid fa-map-pin"></i> Load
          </button>
          <button class="btn btn-outline" id="clear-history-btn">
            <i class="fa-solid fa-eraser"></i> Clear
          </button>
        </div>

        <div class="action-row" style="margin-top: 8px;">
          <button class="btn btn-danger-outline" id="wipe-device-db-btn" style="width: 100%;">
            <i class="fa-solid fa-trash-can"></i> Wipe DB Data
          </button>
        </div>

        <!-- History Stats & Playback -->
        <div id="history-playback-wrap" style="display: none; margin-top: 10px;">
          <div class="history-info-box" id="history-stats">
            <div class="info-row"><span>Pts:</span> <strong id="hist-pts-val">-</strong></div>
            <div class="info-row"><span>Avg Spd:</span> <strong id="hist-spd-val">-</strong></div>
          </div>
          <button class="btn btn-outline btn-play mt-2" id="play-history-btn">
            <i class="fa-solid fa-play"></i> Play Replay
          </button>
        </div>

        <hr class="divider">

        <!-- Auto-ACK & Simulators -->
        <div class="controls-row">
          <label class="switch-label">
            <span class="switch-title"><i class="fa-solid fa-robot green"></i> Auto-ACK</span>
            <label class="switch">
              <input type="checkbox" id="auto-ack-toggle">
              <span class="slider-track"></span>
            </label>
          </label>
        </div>
        


      </div>
    </div>
    
    <!-- TOP RIGHT: Clock & Connection Status -->
    <div class="floating-panel top-right-panel pointer-events-auto">
      <div class="status-box">
        <div class="conn-indicator" id="conn-status" title="Broker: 72.62.126.85:9001">
          <span class="conn-dot offline"></span>
          <span class="status-text">Offline</span>
        </div>
        <div class="clock-divider"></div>
        <div class="clock" id="live-clock">--:--:--</div>
      </div>
    </div>

    <!-- BOTTOM FLOATING CONTROLS: Toggles for Tables/Logs/Stats -->
    <div class="floating-controls bottom-center-controls pointer-events-auto">
      <button class="fab-btn" id="toggle-table-btn">
        <i class="fa-solid fa-table-list"></i> <span class="fab-label">Telemetry</span>
      </button>
      <button class="fab-btn" id="toggle-stats-btn">
        <i class="fa-solid fa-chart-simple"></i> <span class="fab-label">Stats</span>
      </button>
      <button class="fab-btn" id="toggle-log-btn">
        <i class="fa-solid fa-terminal"></i> <span class="fab-label">Logs</span>
      </button>
    </div>

    <!-- BOTTOM SHEET: Fleet Record Statistics -->
    <div class="floating-panel bottom-sheet pointer-events-auto" id="panel-stats">
      <div class="sheet-header">
        <h3><i class="fa-solid fa-chart-simple"></i> Fleet Record Statistics</h3>
        <button class="icon-btn close-sheet-btn" data-target="panel-stats"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="stats-cards-scroll">
        <div class="stats-cards-grid" id="stats-cards-container">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>

    <!-- BOTTOM SHEET: Telemetry Table -->
    <div class="floating-panel bottom-sheet pointer-events-auto" id="panel-telemetry">
      <div class="sheet-header">
        <h3><i class="fa-solid fa-table-list"></i> Fleet Telemetry</h3>
        <button class="icon-btn close-sheet-btn" data-target="panel-telemetry"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="table-scroll">
        <table class="tbl" id="telemetry-table">
          <thead>
            <tr>
              <th>Device</th>
              <th>Time</th>
              <th>Ignition</th>
              <th>Speed</th>
              <th>Battery</th>
              <th>Msg ID</th>
            </tr>
          </thead>
          <tbody id="telemetry-rows">
            <tr class="empty-row"><td colspan="6">Waiting for telemetry connection…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- BOTTOM SHEET: Log Stream -->
    <div class="floating-panel bottom-sheet log-sheet pointer-events-auto" id="panel-log">
      <div class="sheet-header">
        <h3><i class="fa-solid fa-terminal"></i> Ingestion Logs</h3>
        <div class="header-actions">
          <button class="icon-btn" id="clear-log-btn" title="Clear Log"><i class="fa-solid fa-trash-can"></i></button>
          <button class="icon-btn close-sheet-btn" data-target="panel-log"><i class="fa-solid fa-xmark"></i></button>
        </div>
      </div>
      <div class="log-scroll" id="log-stream">
        <div class="log-empty">Waiting for MQTT broadcast on <code>kutai/fleet/data</code>…</div>
      </div>
    </div>

  </div> <!-- End Floating UI -->

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- MQTT.js -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- App Logic -->
  <script src="app.js?v=10"></script>
</body>
</html>
