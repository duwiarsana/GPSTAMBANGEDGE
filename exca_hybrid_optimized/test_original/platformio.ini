[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings - ORIGINAL OLD FIRMWARE TEST (no custom build flags, pure default)
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600

monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.4.3
    knolleary/PubSubClient@^2.8